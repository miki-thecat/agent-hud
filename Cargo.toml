[package]
name = "agent-hud"
version = "0.1.0"
edition = "2024"
description = "Read-only recorded readiness snapshot for recent local Codex sessions"
license = "MIT OR Apache-2.0"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
notify = "8.2"

[target.'cfg(windows)'.dependencies]
windows-canvas = { git = "https://github.com/microsoft/windows-rs", package = "windows-canvas" }
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-window = { git = "https://github.com/microsoft/windows-rs", package = "windows-window" }
